name: sharesansar-events

on:
  schedule:
    # 05:00 NPT = 23:15 UTC previous day (NPT = UTC+5:45). Mon-Fri only.
    # NOTE: GitHub cron is best-effort and may fire a few minutes late.
      - cron: '15 23 * * 0-4'
  workflow_dispatch:        # manual run button in the Actions tab

jobs:
  events:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 lxml pandas openpyxl

      - name: Scrape events and email
        env:
          GMAIL_USER:   ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PW: ${{ secrets.GMAIL_APP_PW }}
          MAIL_TO:      ${{ secrets.MAIL_TO }}
        run: python sharesansar_events_and_mail.py
